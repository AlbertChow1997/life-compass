server:
  port: ${PORT:8080}

spring:
  application:
    name: lifecompass-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:lifecompass}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:lifecompass}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  docker:
    compose:
      enabled: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

lifecompass:
  jwt:
    secret: ${LIFECOMPASS_JWT_SECRET}
    expiration-seconds: ${LIFECOMPASS_JWT_EXPIRATION_SECONDS:604800}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
  cors:
    allowed-origins: ${LIFECOMPASS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
